schema: ainfera.pack_install/v1
pack: Laguna-S-2.1-Spark-Agentic
install:
  role: local_openai_compatible
  weights_policy: external_not_in_git
  diy_gguf: false
  loopback_default: true
  expose_lan_requires: EXPOSE_LAN=1
provider:
  kind: openai_compatible
  base_url: http://127.0.0.1:8000/v1
  api_key: sk-local
  model: local-laguna
  timeout_s: 300
serve:
  engine: llama-server (poolside laguna fork)
  port: 8000
  host: 127.0.0.1
sampling_agent:
  temperature: 0.0
  top_p: 1.0
  max_tokens: 512
  tool_choice: auto
honesty:
  smoke_ne_headline: true
  verifier_ne_gate_clearance: true
  public_promo_before_launch: false
smoke:
  agent_bar: eval/agent_smoke/run_smoke.py
  cases: 40
  class: format_routing_regression
limits:
  port_reserved_note: flagship :8000
